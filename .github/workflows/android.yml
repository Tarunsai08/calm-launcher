name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (domain + app)
        run: ./gradlew --stacktrace :domain:test :app:testDebugUnitTest

      - name: Annotate failing unit tests
        if: failure()
        run: python3 .github/scripts/annotate.py junit domain/build/test-results app/build/test-results

      - name: Build debug and release APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Compile instrumented tests
        run: ./gradlew --stacktrace :app:assembleDebugAndroidTest

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/calm-launcher.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/calm-launcher-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: calm-launcher-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            domain/build/reports/
            app/build/reports/

      # Every push to main refreshes a "latest" pre-release, so the APK can be downloaded
      # straight from GitHub on the phone (Releases -> latest -> calm-launcher.apk).
      - name: Publish rolling "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (#${{ github.run_number }})
          prerelease: true
          make_latest: true
          body: |
            Automatic build of ${{ github.sha }}.
            Install **calm-launcher.apk** (optimized). `calm-launcher-debug.apk` installs side by side as a separate debug app.
          files: |
            dist/calm-launcher.apk
            dist/calm-launcher-debug.apk

  quality:
    name: Lint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: detekt
        run: ./gradlew --stacktrace detekt
      - name: Android lint
        run: ./gradlew --stacktrace :app:lintDebug
      - name: Annotate lint errors
        if: failure()
        run: python3 .github/scripts/annotate.py lint app/build/reports/lint-results-debug.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            build/reports/detekt/

  instrumented:
    name: UI + instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Annotate failing tests
        if: failure()
        run: python3 .github/scripts/annotate.py junit app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
